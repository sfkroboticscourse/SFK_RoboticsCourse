# pupper_vision configuration
# Tune these parameters for your specific Mini Pupper and environment

# ===== Camera Settings =====
camera:
  ros__parameters:
    width: 640
    height: 480
    fps: 30
    flip: true  # Set to true if camera is mounted upside down
    publish_compressed: false  # Enable for remote viewing over slow networks

# ===== Color Detection (Task 1) =====
color_detector:
  ros__parameters:
    visualization: false  # Set true when viewing from PC
    min_area: 500  # Minimum contour area to detect (pixels^2)
    color_follow: true  # Enable turning towards detected colors
    enabled_colors:
      - red
      - orange
      - yellow
      - green
      - blue
      - purple
      - pink

# ===== Shape Detection (Task 2) =====
shape_detector:
  ros__parameters:
    visualization: false
    target_color: green  # Color of the circle sticker to track
    target_radius: 80  # Target bounding box radius in pixels
    radius_tolerance: 15  # Tolerance before moving forward/backward
    min_circularity: 0.7  # 0-1, how circular the shape must be
    forward_speed: 0.1  # Max forward/backward speed (m/s)
    turn_speed: 0.5  # Max turning speed (rad/s)
    control_enabled: true

# ===== Person Detection (Task 3) =====
person_detector:
  ros__parameters:
    visualization: false
    confidence_threshold: 0.5  # Detection confidence threshold
    control_enabled: true
    max_yaw_rate: 1.0  # Maximum turning speed (rad/s)
    kp: 0.8  # Proportional gain for centering
    # Model options: 'hog' (no files needed) or 'mobilenet_ssd' (needs model files)
    model_type: hog

# ===== Pose Detection (Task 4) =====
pose_detector:
  ros__parameters:
    visualization: false
    control_enabled: true
    forward_speed: 0.15
    turn_speed: 0.6
    detection_confidence: 0.5
    tracking_confidence: 0.5

# ===== Vision Controller =====
# Only needed if you want velocity filtering/smoothing
vision_controller:
  ros__parameters:
    max_linear: 0.3  # Maximum linear velocity (m/s)
    max_angular: 1.0  # Maximum angular velocity (rad/s)
    smoothing: 0.3  # Exponential smoothing factor (lower = smoother)
    deadzone: 0.01  # Velocity deadzone
    timeout: 0.5  # Command timeout (seconds)
    passthrough: false  # Set true to disable filtering


# ===== Color HSV Ranges =====
# Tune these if color detection isn't working well in your lighting
# Format: [H_min, S_min, V_min] to [H_max, S_max, V_max]
# H: 0-180 (OpenCV uses half of standard 0-360)
# S: 0-255 (saturation)
# V: 0-255 (value/brightness)
#
# Default ranges (for typical indoor lighting):
# red:    [0,100,100]-[10,255,255] and [160,100,100]-[180,255,255]
# orange: [10,100,100]-[25,255,255]
# yellow: [25,100,100]-[35,255,255]
# green:  [35,100,100]-[85,255,255]
# blue:   [85,100,100]-[130,255,255]
# purple: [130,100,100]-[160,255,255]
# pink:   [140,50,100]-[170,255,255]
#
# To tune: run color_tuner.py (if provided) or use online HSV color picker
